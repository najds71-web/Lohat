<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>على ضفاف المصير — استوديو بناء العالم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a14; --bg2:#141020; --card:#1b1528; --card2:#221a33;
  --gold:#c9a227; --gold2:#e8c65a; --fire:#c0452b; --ink:#e9e2d0;
  --muted:#9a8fb0; --line:#2e2545; --green:#4caf7d; --red:#d05555;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#241a3a 0%,var(--bg) 55%);color:var(--ink);font-family:'Cairo',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3a2f55;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;background:#0f0b1a;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 12px;width:100%;font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{resize:vertical;line-height:1.9}
label{font-size:12.5px;color:var(--muted);display:block;margin:10px 0 4px}

/* ===== Layout ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,#171128,#100c1c);border-left:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{text-align:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand h1{font-family:'Amiri',serif;font-size:22px;color:var(--gold2);letter-spacing:.5px}
.brand p{font-family:'Amiri',serif;font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--ink);padding:10px 12px;border-radius:9px;font-size:14.5px;margin-bottom:3px;transition:.15s;text-align:right}
.nav-btn:hover{background:#241b3a}
.nav-btn.active{background:linear-gradient(90deg,rgba(201,162,39,.22),rgba(201,162,39,.05));color:var(--gold2);border-right:3px solid var(--gold)}
.nav-btn .ic{font-size:17px;width:24px;text-align:center}
.main{flex:1;padding:28px 34px;max-width:1200px}
.sec{display:none;animation:fade .25s}
.sec.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.sec-head h2{font-family:'Amiri',serif;font-size:27px;color:var(--gold2)}
.sec-head .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.btn{background:linear-gradient(135deg,var(--gold),#a5851f);color:#171106;border:none;padding:9px 18px;border-radius:9px;font-weight:700;font-size:13.5px;transition:.15s;box-shadow:0 2px 10px rgba(201,162,39,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(201,162,39,.4)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red);box-shadow:none}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:7px}

/* ===== Cards & grids ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;transition:.2s}
.card:hover{border-color:#4a3a70;transform:translateY(-2px)}
.card h3{font-family:'Amiri',serif;color:var(--gold2);font-size:19px;margin-bottom:6px}
.card .tag{display:inline-block;background:#2c2145;color:#cbb8ff;font-size:11.5px;padding:2px 10px;border-radius:20px;margin:0 0 8px 6px}
.card .tag.g{background:#3a2b12;color:var(--gold2)}
.card .tag.r{background:#3a1712;color:#ff9c8a}
.card .tag.b{background:#12303a;color:#7fd4e8}
.card p{font-size:13.5px;color:#cfc6dd;line-height:1.8;white-space:pre-wrap}
.card .meta{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.card .actions{position:absolute;top:12px;left:12px;display:flex;gap:6px;opacity:0;transition:.15s}
.card:hover .actions{opacity:1}
.ic-btn{background:#0f0b1a;border:1px solid var(--line);color:var(--muted);border-radius:7px;width:28px;height:28px;font-size:13px}
.ic-btn:hover{color:var(--gold2);border-color:var(--gold)}
.ic-btn.del:hover{color:var(--red);border-color:var(--red)}

/* ===== Timeline ===== */
.tl{position:relative;padding-right:26px}
.tl::before{content:'';position:absolute;right:7px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--fire),var(--gold),#4a3a70)}
.tl-item{position:relative;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.tl-item::before{content:'';position:absolute;right:-25px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tl-item .year{font-weight:900;color:var(--gold2);font-size:15px}
.tl-item h4{font-family:'Amiri',serif;font-size:17.5px;margin:2px 0 5px}
.tl-item p{font-size:13.5px;color:#cfc6dd;line-height:1.8;white-space:pre-wrap}
.tl-item .era-tag{font-size:11.5px;color:var(--muted)}
.tl-item .actions{position:absolute;top:12px;left:12px;display:flex;gap:6px;opacity:0;transition:.15s}
.tl-item:hover .actions{opacity:1}
.era-block{margin:26px 0 10px;padding:12px 18px;border-radius:12px;background:linear-gradient(90deg,rgba(192,69,43,.18),transparent);border-right:4px solid var(--fire)}
.era-block h3{font-family:'Amiri',serif;font-size:21px;color:#ffb59f}
.era-block p{font-size:13px;color:var(--muted)}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(5,3,12,.75);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:1px solid #453564;border-radius:16px;width:640px;max-width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{font-family:'Amiri',serif;color:var(--gold2);font-size:21px;margin-bottom:8px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ===== Editor ===== */
.editor-wrap{display:grid;grid-template-columns:280px 1fr;gap:18px}
.ch-list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:70vh;overflow-y:auto}
.ch-item{padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;border:1px solid transparent;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.ch-item:hover{background:#241b3a}
.ch-item.active{background:linear-gradient(90deg,rgba(201,162,39,.2),transparent);border-color:var(--gold)}
.ch-item .n{color:var(--muted);font-size:11.5px}
.ch-editor{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.ch-editor textarea{min-height:48vh;font-family:'Amiri',serif;font-size:17px;line-height:2.1;background:#0d0a16}
.wc{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:18px}

/* ===== AI image section ===== */
.ai-site{display:flex;gap:14px;align-items:flex-start}
.ai-site .logo{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ai-site h4{font-size:16px;margin-bottom:3px}
.ai-site p{font-size:12.5px;color:var(--muted);line-height:1.7}
.ai-site a{color:var(--gold2);font-size:12.5px;text-decoration:none}
.ai-site a:hover{text-decoration:underline}
.prompt-out{background:#0d0a16;border:1px dashed var(--gold);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.9;min-height:90px;white-space:pre-wrap;margin-top:12px;direction:ltr;text-align:left;font-family:monospace}

/* ===== Dashboard ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.stat .num{font-size:30px;font-weight:900;color:var(--gold2)}
.stat .lbl{font-size:12.5px;color:var(--muted)}
.quote{font-family:'Amiri',serif;font-size:19px;color:#cbb8ff;text-align:center;padding:22px;border:1px dashed #453564;border-radius:14px;margin-bottom:24px;font-style:italic;line-height:2}
.mapbox{background:#0d0a16;border:1px solid var(--line);border-radius:14px;padding:20px;overflow-x:auto}
.mapbox pre{font-family:'Cairo',monospace;font-size:12.5px;line-height:1.7;color:#b8aed0;direction:ltr;text-align:center}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%) translateY(80px);background:#1e2b1e;border:1px solid var(--green);color:#a9e8c5;padding:11px 22px;border-radius:10px;z-index:99;transition:.3s;font-size:14px}
.toast.on{transform:translateX(50%) translateY(0)}
@media(max-width:860px){.layout{flex-direction:column}.sidebar{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}.brand{width:100%}.nav-btn{width:auto}.editor-wrap{grid-template-columns:1fr}.main{padding:18px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <h1>على ضفاف المصير</h1>
      <p>«تتكسَّر أحلام الفرسان»</p>
    </div>
    <button class="nav-btn active" data-sec="dash"><span class="ic">🏰</span> لوحة التحكم</button>
    <button class="nav-btn" data-sec="timeline"><span class="ic">⏳</span> الخط الزمني</button>
    <button class="nav-btn" data-sec="races"><span class="ic">🧬</span> الشعوب والأجناس</button>
    <button class="nav-btn" data-sec="families"><span class="ic">🛡️</span> العائلات والقوى</button>
    <button class="nav-btn" data-sec="chars"><span class="ic">👤</span> الشخصيات</button>
    <button class="nav-btn" data-sec="places"><span class="ic">🗺️</span> الأماكن والمواقع</button>
    <button class="nav-btn" data-sec="secrets"><span class="ic">🕯️</span> الأسرار والخبايا</button>
    <button class="nav-btn" data-sec="chapters"><span class="ic">📖</span> كتابة الفصول</button>
    <button class="nav-btn" data-sec="ai"><span class="ic">🎨</span> تصميم الصور AI</button>
    <button class="nav-btn" data-sec="export"><span class="ic">💾</span> التصدير والنسخ</button>
  </aside>
  <main class="main">
    <section id="dash" class="sec show"></section>
    <section id="timeline" class="sec"></section>
    <section id="races" class="sec"></section>
    <section id="families" class="sec"></section>
    <section id="chars" class="sec"></section>
    <section id="places" class="sec"></section>
    <section id="secrets" class="sec"></section>
    <section id="chapters" class="sec"></section>
    <section id="ai" class="sec"></section>
    <section id="export" class="sec"></section>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
// ====== بيانات عالم «على ضفاف المصير» المحمّلة مسبقًا ======
const DEFAULT_DB = {

eras: [
 {id:'e1', name:'عصر البدايات', range:'قبل آلاف السنين من السور', desc:'لا ممالك ولا دول. القارة مقسّمة بين قبائل وشعوب متفرقة: البشر الأوائل، أبناء الصحراء، العمالقة، السحرة الأوائل، الفراشات المجنحة، أبناء ماء السماء، وذوو العين الواحدة في أقصى الشرق (قرن الشيطان لاحقًا). ذوو العين الواحدة لم يكونوا شريرين منذ البداية — كانوا شعبًا قديمًا له حضارته وسحره وأرضه.'},
 {id:'e2', name:'عصر النار', range:'0 – 32 ق.س', desc:'حرب القيامة: أوبئة واختفاءات وحرائق تتزامن مع تحرك ذوي العين الواحدة غربًا. اتحاد الأجناس تحت الملك سعيد الأول، معركة القيامة في صحراء الهلاك، تدخل الفراشات الثلاثمائة، وبناء سور الأمل الكبير.'},
 {id:'e3', name:'عصر السور', range:'1 – 1100 ب.س', desc:'العالم الجديد بعد السور: موت آخر شاهد، ظهور الممالك، تأسيس منارة العالم، صعود آل الصارم وآل اليم والظل، وانقسام السحرة إلى حماة الأختام ونسّاجي الأثير.'},
 {id:'e4', name:'حقبة الصمت', range:'حتى 1500 ب.س', desc:'الناس ينسون لماذا بُني السور ويظنونه سلسلة جبلية طبيعية. كان يجب تجديد الأختام في 1500 ب.س بدماء الملوك من كل جنس — لكن الممالك غرقت في الصراعات والطمع ولم يفعل أحد شيئًا.'},
 {id:'e5', name:'عصر المصير', range:'1544 ب.س — زمن الرواية', desc:'بعد 44 سنة من الموعد الفائت للتجديد. موت غامض في بلدة اليم، اختفاءات، رائحة عفن، ختم واحد يضعف، وطرقات تحت جبال الصارخات... وزاهر يستيقظ: «لقد عادوا».'}
],

timeline: [
 {id:'t1', num:-999999, year:'قبل آلاف السنين', era:'عصر البدايات', title:'سقوط السماء', text:'انشقت السماء فوق القارة، وهطل المطر سبعة أيام وسبع ليالٍ. في الليلة السابعة ظهرت مجموعة من البشر وسط المطر، منهم أسلاف عائلة ماء السماء. منذ ذلك اليوم آمنوا أنهم «أبناء السماء الذين نزلوا مع المطر». هل نزلوا فعلًا من السماء؟ أم بشر عاديون هربوا إلى مكان مجهول؟ — سر قد تكشفه الرواية.'},
 {id:'t2', num:0, year:'0 ق.س', era:'عصر النار', title:'بداية حرب القيامة', text:'أوبئة وأمراض مجهولة في شرق القارة، سكان يختفون من قرى كاملة، وقرى أخرى تحترق. يتزامن التوسع مع تحرك ذوي العين الواحدة غربًا، فتنتشر الشائعات: «ذوو العين الواحدة يجلبون الموت معهم». لكن لا أحد يعرف الحقيقة.'},
 {id:'t3', num:-17, year:'17 ق.س', era:'عصر النار', title:'سقوط المدن الشرقية', text:'تسقط عدة مدن بشرية، وتبدأ القبائل بالنزوح غربًا. يظهر للمرة الأولى اسم «طريق الموت» — الطريق القديم الذي سيصبح بعد بناء السور بقرون «طريق السلاطين».'},
 {id:'t4', num:-29, year:'29 ق.س', era:'عصر النار', title:'اتحاد الأجناس', text:'يجتمع لأول مرة: البشر، أبناء الصحراء، العمالقة، السحرة، الفراشات المجنحة، أبناء ماء السماء. يظهر الملك سعيد الأول — ليس أعظم محارب ولا أقوى الملوك، لكنه أول من جعل القبائل البشرية تتصرف كأمة واحدة.'},
 {id:'t5', num:-31.4, year:'31 ق.س — قبل المعركة بسبعة أيام', era:'عصر النار', title:'مطر الذاكرة يرى الجيش الأسود', text:'في ليلة عاصفة يهطل المطر فوق الجزيرة الحائرة والبر الرئيسي، فيرى أحد أبناء ماء السماء بقدرة «مطر الذاكرة»: جيشًا أسود، مدنًا تحترق، جثثًا على الطرق — وذوي العين الواحدة يتجهون غربًا.'},
 {id:'t6', num:-31.35, year:'31 ق.س', era:'عصر النار', title:'اجتماع الأجناس ورفض زرفال', text:'يحاول ملك ماء السماء تحذير الأجناس عبر سحر الأحلام، لكن الرسالة لا تصل للجميع. زرفال كبير الفراشات يرفض: «البشر سيتسببون يومًا في خراب العالم، فلماذا ننقذهم من حربهم؟» فيجيبه الساحر: «لا أريد منك جيشًا... أريد منك أن تنظر.»'},
 {id:'t7', num:-31.3, year:'31 ق.س', era:'عصر النار', title:'نبوءة الفراشات تتحقق', text:'«إذا احترقت الأرض تحتها، واسودّت السماء فوقها، فاعلموا أن نار الشرق لن تتوقف حتى تبلغ جناح النسر.» يرى زرفال الأفق يحمرّ والسماء تشتعل بلون الدم، فيعرف أن النبوءة بدأت.'},
 {id:'t8', num:-31.25, year:'31 ق.س', era:'عصر النار', title:'العمالقة يدخلون الحرب', text:'جلمود يرفض في البداية: «لسنا عبيدًا للبشر. سنوات طويلة عاملتمونا كمسوخ.» لكن حارسًا يقتحم المجلس: «الجبال من جهة الشرق... تُضرب من الداخل.» تنشق صخرة ضخمة ويخرج منها دخان أسود — الحرب وصلت إلى جبالهم.'},
 {id:'t9', num:-31.2, year:'31 ق.س', era:'عصر النار', title:'ميلاد فكرة السور وميثاقه', text:'الفارس لجلمود: «لا نحتاج إلى الانتصار اليوم، نحتاج إلى إيقافهم. أنتم تبنون الجبال... والسحرة يختمونها.» شروط الميثاق: (1) السور أمان جميع الأجناس لا ملك للبشر. (2) لا عودة للعمالقة إلى حياة النبذ ولهم موطن وحق. (3) تُكتب أسماء كل العمالقة الذين يموتون في البناء على جدرانه. (4) إذا عاد الخطر، لا تتخلى الممالك عن أبناء الصحراء حُراس الحدود. ويوقّع جميع الزعماء العهد.'},
 {id:'t10', num:-31.15, year:'31 ق.س', era:'عصر النار', title:'قرار زرفال', text:'التحالف منهك، السحرة يفشلون في إيقاف جيش النار، والعمالقة يسقطون وهم يبنون التحصينات. يجمع زرفال الفراشات ويقول: «لن نحارب من أجل البشر... سنحارب من أجل العالم الذي يعيشون فيه.»'},
 {id:'t11', num:-31.1, year:'31 ق.س', era:'عصر النار', title:'معركة القيامة الكبرى', text:'ينهار التحالف في صحراء الهلاك: العمالقة يتراجعون، السحرة يخسرون أعدادًا هائلة، أبناء الصحراء يفقدون فرسانهم ويُقتل قائدهم «سهم». ثم يُسمع خفقان مئات الأجنحة — تظهر الفراشات الثلاثمائة وفوقها زرفال: «لقد انتظرناكم ألف عام.» تشتعل النار في أعينها وتتحول الرفرفة إلى جدار لهب يحجز جيش النار، وخلفه يبني العمالقة والسحرة السور. الثمن: أجنحة تحترق، وأجساد تسقط، وقليلون ينجون.'},
 {id:'t12', num:-32, year:'32 ق.س', era:'عصر النار', title:'اكتمال سور الأمل الكبير', text:'بعد قرابة عام من البناء: العمالقة يقطعون الصخور، البشر ينقلون المعادن، السحرة يضعون الأختام، أبناء الصحراء يحرسون، والفراشات تحمي المواقع. المواصفات: ارتفاع 800 متر، طول 200 كيلومتر، عرض كيلومتر واحد. مبني من الحجارة والمعادن والصخور المنصهرة ومواد سحرية — وقوته الحقيقية في الأختام.'},
 {id:'t13', num:1, year:'1 ب.س', era:'عصر السور', title:'سقوط قرن الشيطان', text:'تتراجع مخلوقات النار إلى الشرق، ويدخل آخر جيش منها مدينة قرن الشيطان، وتُغلق البوابات ويُفعّل آخر ختم. منذ ذلك اليوم لا يخرج أحد من قرن الشيطان — ويبدأ العالم الجديد.'},
 {id:'t14', num:2, year:'2 ب.س', era:'عصر السور', title:'اختفاء الفراشات', text:'من أصل 300 فراشة يموت معظمهم، ويعود الناجون إلى جزيرة جناح النسر ثم تنتشر شائعة الانقراض. حتى مطر الذاكرة لا يستطيع رؤية الجزيرة — ربما لا تستقبل المطر، وربما حجبتها الفراشات بسحر قديم. مصيرها يبقى مجهولًا.'},
 {id:'t15', num:103, year:'103 ب.س', era:'عصر السور', title:'موت آخر شاهد', text:'يموت آخر إنسان شهد معركة القيامة — ويبدأ تحوّل التاريخ الحقيقي إلى أسطورة.'},
 {id:'t16', num:300, year:'300 ب.س', era:'عصر السور', title:'ظهور الممالك', text:'تظهر الممالك البشرية والحدود والقصور والجيوش. يصبح السور جزءًا من جغرافية العالم، حتى تظن الأجيال الجديدة أنه جبل طبيعي قديم.'},
 {id:'t17', num:500, year:'500 ب.س', era:'عصر السور', title:'تأسيس منارة العالم', text:'تُؤسس منارة العالم وتصبح مركز العلم والسحر والتاريخ والفلك والتجارة — أكبر مركز للمعرفة في القارة.'},
 {id:'t18', num:700, year:'700 ب.س', era:'عصر السور', title:'صعود آل الصارم', text:'تسيطر عائلة آل الصارم على المناطق المحيطة بقلعة العذاب، ومهمتها الرسمية حماية طريق السلاطين. مع القرون تتحول من حراس حدود إلى قوة سياسية وعسكرية ضخمة.'},
 {id:'t19', num:900, year:'900 ب.س', era:'عصر السور', title:'خليج السلاطين وآل اليم والظل', text:'تزدهر التجارة البحرية، وتسيطر عائلة آل اليم والظل على الخليج، وتنشأ شبكة تجارية تربط منارة العالم وطريق السلاطين وقلعة العذاب والأراضي المقفرة والموانئ الشمالية.'},
 {id:'t20', num:1100, year:'1100 ب.س', era:'عصر السور', title:'انقسام السحرة', text:'ينقسم سحرة الجزيرة الحائرة: «حماة الأختام» يريدون الحفاظ على السور مهما كان الثمن، و«نسّاجو الأثير» يريدون اكتشاف حقيقة مخلوقات النار وما خلف السور. ثم يختفي عدد من كبار السحرة — ماتوا؟ أم اكتشفوا الحقيقة؟'},
 {id:'t21', num:1500, year:'1500 ب.س', era:'حقبة الصمت', title:'موعد التجديد الفائت', text:'السر المدفون: السور لا يعيش إلى الأبد — كل 1500 سنة تُجدَّد الأختام بدماء الملوك من كل جنس. في 1500 ب.س كان يجب أن يبدأ التجديد، لكن الممالك غارقة في الصراعات والطمع والحروب ونسيان التاريخ... ولم يفعل أحد شيئًا. أغانٍ قديمة لدى شيوخ الصحراء تقول: «لا تجعلوا النار تعبر الحجر» — ولا يعرف الشباب معناها.'},
 {id:'t22', num:1544, year:'1544 ب.س', era:'عصر المصير', title:'بداية الرواية', text:'بعد 44 سنة من الموعد الفائت. جثة بلا جروح على شاطئ بلدة اليم، جلد متآكل ورائحة عفن. موت صامت يفتك بالعشرات ثم المئات، واختفاءات بلا أثر. عجوز تقول: «هذه ليست رائحة مرض... إنها رائحة النار.»'},
 {id:'t23', num:1544.1, year:'1544 ب.س', era:'عصر المصير', title:'إغلاق طريق السلاطين وأزمة الخلافة', text:'آل الصارم يغلقون الطريق ويفتشون كل قادم من الشرق بقسوة — رسميًا بسبب «وباء». وفي الأراضي المقفرة يحتضر ملك أبناء الصحراء بلا خليفة — وأبناء الصحراء أحد الأجناس المطلوبة دماؤها الملكية للتجديد. وهذه ليست مصادفة.'},
 {id:'t24', num:1544.2, year:'1544 ب.س', era:'عصر المصير', title:'الختم الواحد والطرقات الثلاث', text:'في الجزيرة الحائرة يشعر السحرة بضعف الأختام — ليس كلها، ختم واحد فقط. وفي جبال الصارخات يسمع العمالقة طرقًا تحت الأرض: ثلاث طرقات... صمت... ثلاث طرقات. ويعرفون أنه ليس صوت جبل. مجموعة استطلاع آل الصارم إلى أطراف السور لا تعود.'},
 {id:'t25', num:1544.3, year:'1544 ب.س', era:'عصر المصير', title:'استيقاظ زاهر — نهاية الجزء الأول', text:'في جزيرة جناح النسر يستيقظ زاهر بعد قرون من الصمت، ينظر إلى السماء ويقول: «لقد عادوا.» يسأله حارسه: «من؟» فيجيب: «الذين كنا نحرس العالم منهم.»'}
],

races: [
 {id:'r1', name:'البشر', tag:'الجنس الأوسع انتشارًا', desc:'ينقسمون إلى ممالك وعائلات وقبائل ومدن، ولا يوجد ملك واحد يحكمهم جميعًا. أبرز قواهم: آل الصارم، آل ماء السماء، العائلات التجارية في خليج السلاطين، ممالك الشمال، مدن الساحل، سكان منارة العالم، وسكان الأراضي الغربية. أكثر الأجناس اختلافًا في العادات والمعتقدات.'},
 {id:'r2', name:'أبناء ماء السماء', tag:'الدماء السحرية', desc:'من أقدم العائلات، يسمّون أنفسهم «أبناء السماء». يعيشون قرب المياه ويرتبط تاريخهم الديني والأسري بالمطر. قدرتهم النادرة «مطر الذاكرة»: رؤية أحداث بعيدة أثناء هطول المطر، بدرجات قوة مختلفة بين الأفراد. أماكنهم المقدسة: معبد السماء الأولى (حوض حجري لا يمتلئ إلا بالمطر)، ضريح أبناء السماء (لا يدخله إلا السلالة)، وبئر المطر الأول حيث سقطت أول قطرة مطر في القارة.'},
 {id:'r3', name:'أبناء الصحراء', tag:'حرّاس خط الدفاع الأول', desc:'عددهم يتجاوز 60 ألفًا في الأراضي المقفرة. أقوياء البنية، طوال القامة (قد يتجاوز الواحد المترين)، بشرة حنطية وأنوف حادة، والرجال يربّون الذقون. صائدون مهرة بالرماح والأقواس والسيوف والخناجر، يتدرّب أطفالهم منذ الصغر على السلاح والصيد وتعقّب الآثار وقراءة الرياح. يقدّسون كبار السن والضيافة والشرف والعهد والشجاعة: «من دخل خيمتك، دخل عهدك.» آلهتهم: إله الموت، إله الحرب، إله المطر (الخير). ملكهم يُختار عند الحرب بشروط: نسب شريف من الأب والأم، قيادة حرب والانتصار بها، الحكمة والكرم، تجاوز الأربعين، وقدرة على جمع السادة. المرأة لا تتزعم ولا تحارب لكنها تشارك في المجالس وتُدوَّن الحكمة والتواريخ. مقدساتهم: وادي الأسلاف، صخرة العهد، معبد المطر، ضريح سهم. تربطهم مواثيق وثيقة بالعمالقة. يعرفون خطر الصارخات: صوف وقطن بالزيت في الآذان، وربط الأجساد بالحبال أثناء العواصف.'},
 {id:'r4', name:'العمالقة (أبناء الصخر / الجلاميد)', tag:'بُناة السور', desc:'طول الواحد 4–6 أمتار، أجساد صلبة كالحجارة يقال إن الرماح لا تخترقها، بشرة خشنة رمادية. يسكنون جبال العهد / سلاسل جبال الصارخات، ويؤمنون أن «الجبل يتذكر» فيحفظون تاريخهم بالنقوش الحجرية. قليلون حاليًا ويعيشون في عزلة؛ مهندسون وبنّاؤون أسطوريون، بطيئو الحركة سريعو الغضب. مقدساتهم: قاعة جلمود، مقبرة الحجارة (يدفنون موتاهم في تجاويف جبلية تُغلق بالحجر)، وجسر الألف يد.'},
 {id:'r5', name:'الفراشات المجنحة', tag:'حرّاس النبوءة', desc:'مخلوق أسطوري يجمع هيئة البشر والنسور: وجه وأطراف بشرية، جناحان ضخمان، عينان كبيرتان يخرج منهما لهب يذيب الحجر والمعادن (لكنه ينهكها وقد يقتلها، فلا تقاتل إلا في المعارك العظمى)، مخالب كمخالب النسور، ريش الأجنحة حاد كرؤوس الرماح. الطول 5–8 أمتار والعرض 3 أمتار. موطنها جزيرة جناح النسر أقصى الشمال الغربي. معمّرة قد تعيش آلاف السنين، والتكاثر نادر. العدد الحالي المقدّر: 310. مقدساتها: قمة الجناح، وادي النار البيضاء، ومقبرة الثلاثمائة (أسماء فراشات معركة القيامة محفورة على الصخور — لا يعرف أحد من الخارج هل هي حقيقية).'},
 {id:'r6', name:'مخلوقات النار (ذوو العين الواحدة)', tag:'الاسم الذي أطلقه المنتصرون', desc:'اسمهم القديم «ذوو العين الواحدة»؛ وأما «مخلوقات النار» فاسم أطلقه البشر بعد حرب القيامة. عين واحدة في منتصف الرأس، يشبهون البشر في القوائم لكنهم أقصر (نحو 138 سم). الذكور لهم قرون، والإناث لهن شعر تنتهي كل شعرة بإبرة كإبرة العقرب تنفث سمًا قاتلًا. يرون البعيد ويسمعون همسات لا يسمعها البشر. يركبون وحوشًا شبيهة بالخيول: فكوك ضخمة، أسنان ومخالب حادة، طيران محدود، ولعاب يذيب اللحم والحديد. آخر مكان معروف: قرن الشيطان خلف السور. لم يكونوا شريرين منذ البداية — شعب قديم له حضارته وسحره، وما حدث بينه وبين الأجناس هو ما حوّله. السر: ربما لم يكونوا يغزون العالم، بل يحاولون الوصول إلى شيء في الغرب... تحت الأرض.'},
 {id:'r7', name:'الدبابير — قطاع الطرق', tag:'«لا سيد فوق الطريق»', desc:'ليسوا قبيلة واحدة بل تجمع من قطاع الطرق والمرتزقة والهاربين واللصوص والخارجين عن القانون والجنود السابقين ومن فقدوا قبائلهم. لا يدينون لأي ملك. معقلهم الأسطوري «عش الدبابير»: قلعة سرية في جبال وادي الذئاب بعدة مداخل سرية تؤدي لكهوف قديمة، وقائدهم لا يُعرف إلا بلقب «ملك العش». قوانينهم الخمسة: لا يبيع الدبور دبورًا؛ لا يقتل الأطفال؛ لا يُنهب من دخل تحت حماية العش؛ من يدفع ثمن المرور لا يُمسّ؛ الخيانة عقوبتها الموت.'}
],

families: [
 {id:'f1', name:'آل الصارم (حديد النار)', tag:'قلعة العذاب', desc:'عائلة بشرية عسكرية صارمة تسيطر على قلعة العذاب وتحمي طريق السلاطين. تملك أكبر مناجم الحديد والمطاردات القتالية. تكره السحرة وترى أن القوة البدنية والتكتيك العسكري هما حاميا العالم الوحيدان. ظهرت سنة 700 ب.س وتحولت من حراس حدود إلى قوة سياسية وعسكرية ضخمة. عند بداية الرواية تفرض حظرًا قاسيًا على طريق السلاطين خوفًا من «الوباء»، مما يزيد التوتر بين العوائل. مقدساتهم: ضريح فرسان العذاب (يوضع سيف الفارس فوق قبره)، ساحة السيوف، سرداب الأجداد.'},
 {id:'f2', name:'عائلة ماء السماء', tag:'الدماء السحرية', desc:'من العائلات السامية، يقال إنهم نزلوا من السماء مع انهمار المطر، وكان لهم دور فعّال في حرب القيامة مع الفراشات. في مستودع الملك رعد قصيدة قديمة: «دماؤنا خُلقت لتفدي دماء العالم» — معناها الحقيقي: دم ملك واحد منهم يقوم مقام دماء بقية الملوك في تجديد الأختام، فتصبح العائلة هدفًا. والبيت الأخطر: «ومن جعل دم السماء ختمًا على الخلود، طال عمره ما دام الحجر قائمًا.» ينقسمون: فريق يريد إنقاذ القارة، وفريق يريد استخدام الأختام لأنفسهم.'},
 {id:'f3', name:'آل اليم والظل (حكام خليج السلاطين)', tag:'التجارة والمعلومات', desc:'تجار أثرياء للغاية يسيطرون على خليج السلاطين والتجارة البحرية منذ 900 ب.س. يملكون أسطولًا بحريًا ضخمًا، ويتعاملون بالجواسيس والمعلومات أكثر من القتال المباشر. يربطهم حلف تجاري مع عائلة ماء السماء. نفوذهم يفوق نفوذ بعض الملوك.'}
],

chars: [
 {id:'c1', name:'الملك سعيد الأول', role:'قائد اتحاد الأجناس', race:'البشر', era:'عصر النار (29 ق.س)', status:'تاريخي', desc:'لم يكن أعظم محارب ولا أقوى ملوك عصره، لكن فضله التاريخي أنه أول من جعل القبائل البشرية تتصرف كأمة واحدة تحت راية واحدة.'},
 {id:'c2', name:'سهم', role:'قائد أبناء الصحراء', race:'أبناء الصحراء', era:'معركة القيامة (31 ق.س)', status:'تاريخي — قُتل في المعركة', desc:'قاد فرسان الصحراء في معركة القيامة وقُتل فيها. أصبح ضريحه في الأراضي المقفرة رمزًا للوحدة.'},
 {id:'c3', name:'جلمود', role:'زعيم العمالقة', race:'العمالقة', era:'عصر النار', status:'تاريخي', desc:'رفض في البداية إنقاذ البشر: «لسنا عبيدًا للبشر.» ثم دخل الحرب حين وصلت إلى جباله، ووقّع ميثاق السور بشروطه الأربعة. قاعة جلمود في الجبال تحمل اسمه ويقال إن أول اجتماع لبناء السور عُقد فيها.'},
 {id:'c4', name:'زرفال', role:'كبير الفراشات المجنحة', race:'الفراشات المجنحة', era:'عصر النار', status:'تاريخي', desc:'رفض التدخل أولًا: «البشر سيتسببون يومًا في خراب العالم.» ثم رأى النبوءة تتحقق وقاد الفراشات الثلاثمائة إلى معركة القيامة: «لن نحارب من أجل البشر... سنحارب من أجل العالم الذي يعيشون فيه.»'},
 {id:'c5', name:'زاهر', role:'الفراشة التي تستيقظ', race:'الفراشات المجنحة', era:'عصر المصير (1544 ب.س)', status:'حي — محوري', desc:'يستيقظ في جزيرة جناح النسر بعد قرون من الصمت ويقول: «لقد عادوا... الذين كنا نحرس العالم منهم.» عبارته القديمة في المعركة «لقد انتظرناكم ألف عام» ستكتسب معنى مختلفًا تمامًا في نهاية الرواية.'},
 {id:'c6', name:'زفير', role:'كبير الفراشات المجنحة الحالي', race:'الفراشات المجنحة', era:'عصر المصير', status:'حي', desc:'قائد حراس جزيرة جناح النسر. جسده مليء بالندوب القديمة، وهو من القلائل المنحدرين مباشرة من سلالة الـ300 فراشة الذين أوقفوا مخلوقات النار في معركة القيامة. حذر، يرفض شؤون البشر ويرى أنهم يستغلون قوة الفراشات ثم يتخلون عنها.'},
 {id:'c7', name:'الملك رعد', role:'ملك من أبناء ماء السماء', race:'أبناء ماء السماء', era:'غير محدد بدقة', status:'—', desc:'في مستودعه تُحفظ القصيدة القديمة: «دماؤنا خُلقت لتفدي دماء العالم» — مفتاح سر الدم الملكي البديل في تجديد الأختام.'},
 {id:'c8', name:'ملك العش', role:'قائد الدبابير', race:'الدبابير', era:'عصر المصير', status:'حي — هوية مجهولة', desc:'لا يُعرف قائد الدبابير إلا بهذا اللقب، ولا يعرف أحد اسمه الحقيقي. يحكم عش الدبابير في وادي الذئاب بقوانينهم الخمسة.'}

 {id:'p4', name:'المستعر العظيم', cat:'منطقة طبيعية', desc:'منطقة بركانية قديمة هائلة في وسط القارة: أرض سوداء وصخور حمراء وحرارة مرتفعة. يعتقد السكان أنها أثر من آثار عصر النار. كهوفها تحوي معادن نادرة يتنافس عليها الحدادون والتجار والسحرة والباحثون. في أطرافها «معبد اللهب الأول»: نقوشه أقدم من الممالك البشرية — وقد يصبح دليلًا على أن تاريخ مخلوقات النار أقدم مما يظن الجميع.'},
 {id:'p5', name:'خليج السلاطين', cat:'مركز بحري تجاري', desc:'أهم مركز بحري وتجاري: موانئ ضخمة وسفن وتجار وصيادون ومرتزقة وقراصنة، وتملك عائلاته التجارية نفوذًا يفوق بعض الملوك. معالمه: معبد البحر الهادئ، ضريح الغارقين (أسماء البحارة الموتى على ألواح حجرية)، ومنارة البحارة. أسطورته: «أشباح السفن العمياء» — سفن مسكونة بلا أشرعة تظهر في الضباب يقودها وحوش بلا وجوه، تنقل أجساد الذين اختفوا في البحار؛ والبحارة يرمون الفضة قربانًا قبل كل رحلة.'},
 {id:'p6', name:'طريق السلاطين', cat:'طريق', desc:'أهم طريق بري في القارة: المناطق الشرقية ← وادي الذئاب ← قلعة العذاب ← الأراضي الداخلية ← منارة العالم. طريق تجاري وعسكري عليه نقاط حراسة وخانات وآبار ومحطات قوافل وتماثيل ملوك وأضرحة وأطلال معابد. السيطرة عليه مصدر قوة هائل. اسمه القديم في عصر النار: «طريق الموت».'},

 {id:'p9', name:'بلدة اليم', cat:'بلدة ساحلية', desc:'على الساحل في أقصى الشرق خلف وادي الذئاب — بؤرة بداية الرواية. جثث بلا جروح ولا دم بجلد متآكل، موت صامت في النوم، اختفاءات بلا أثر، ورائحة عفن تقول عنها العجائز: «رائحة النار». البحارة يسمونها طاعونًا، ورواد الحانات يقولون إن الأرض غضبت وابتلعت سكانها.'},

 {id:'p12', name:'جبال الصارخات (جبال العهد)', cat:'سلسلة جبلية', desc:'سلسلة هائلة بمحاذاة صحراء الهلاك من الشمال الغربي، تعصف بها الرياح فتصدر أصواتًا كالصراخ. موطن العمالقة. عند بداية الرواية يسمع العمالقة طرقًا تحت الأرض: ثلاث طرقات... صمت... ثلاث طرقات — وليس صوت جبل.'},

// ====== المنطق البرمجي ======
const LS_KEY='difaf_db_v1';
let DB;
try{ const saved=localStorage.getItem(LS_KEY); DB = saved? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DB)); }
catch(e){ DB = JSON.parse(JSON.stringify(DEFAULT_DB)); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); toast('تم الحفظ ✓'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }
function uid(p){ return p+Date.now().toString(36)+Math.floor(Math.random()*999); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ====== التنقل ======
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));
  const id=b.dataset.sec; document.getElementById(id).classList.add('show'); render(id);
}));

// ====== المودال ======
const modalBg=document.getElementById('modalBg'), modalBox=document.getElementById('modalBox');
function openModal(html){ modalBox.innerHTML=html; modalBg.classList.add('open'); }
function closeModal(){ modalBg.classList.remove('open'); }
modalBg.addEventListener('click',e=>{ if(e.target===modalBg) closeModal(); });

// ====== نماذج التحرير العامة ======
const FIELDS={
 races:[['name','الاسم'],['tag','وسم قصير'],['desc','الوصف','ta']],
 families:[['name','اسم العائلة'],['tag','الموقع / النفوذ'],['desc','الوصف والخصائص','ta']],
 chars:[['name','الاسم'],['role','الدور'],['race','الجنس / العرق'],['era','الحقبة الزمنية'],['status','الحالة (حي/تاريخي...)'],['desc','الوصف','ta']],
 places:[['name','اسم المكان'],['cat','التصنيف (مدينة/موطن/قلعة...)'],['desc','الوصف','ta']],
 secrets:[['name','عنوان السر'],['level','درجة السرية'],['desc','التفاصيل','ta']],
 timeline:[['year','السنة (مثال: 31 ق.س)'],['num','الرقم للترتيب (ق.س سالب: -31 / ب.س موجب: 31)'],['era','العصر'],['title','عنوان الحدث'],['text','الوصف','ta']]
};
const AR_NAMES={races:'الشعوب والأجناس',families:'العائلات والقوى',chars:'الشخصيات',places:'الأماكن',secrets:'الأسرار',timeline:'حدث زمني'};

function editItem(sec,id){
  const arr=DB[sec]; const item=id? arr.find(x=>x.id===id) : {};
  let h=`<h3>${id?'تعديل':'إضافة'} — ${AR_NAMES[sec]}</h3>`;
  FIELDS[sec].forEach(f=>{
    const v=esc(item[f[0]]||'');
    h+=`<label>${f[1]}</label>`;
    h+= f[2]==='ta'? `<textarea id="mf_${f[0]}" rows="5">${v}</textarea>` : `<input id="mf_${f[0]}" value="${v}">`;
  });
  h+=`<div class="foot"><button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="saveItem('${sec}','${id||''}')">حفظ</button></div>`;
  openModal(h);
}
function saveItem(sec,id){
  const obj={};
  FIELDS[sec].forEach(f=>{ let v=document.getElementById('mf_'+f[0]).value.trim(); if(f[0]==='num') v=parseFloat(v)||0; obj[f[0]]=v; });
  if(id){ const i=DB[sec].findIndex(x=>x.id===id); DB[sec][i]=Object.assign(DB[sec][i],obj); }
  else { obj.id=uid(sec[0]); DB[sec].push(obj); }
  save(); closeModal(); render(sec);
}
function delItem(sec,id){
  if(!confirm('حذف نهائي؟')) return;
  DB[sec]=DB[sec].filter(x=>x.id!==id); save(); render(sec);
}

// ====== العرض ======
function cardHTML(sec,item,titleField,tagField,descField,extra){
  return `<div class="card">
    <div class="actions">
      <button class="ic-btn" title="تعديل" onclick="editItem('${sec}','${item.id}')">✏️</button>
      <button class="ic-btn del" title="حذف" onclick="delItem('${sec}','${item.id}')">🗑️</button>
    </div>
    <h3>${esc(item[titleField])}</h3>
    ${item[tagField]?`<span class="tag g">${esc(item[tagField])}</span>`:''}

  </div>`;
}

}

let activeCh=null;
function renderChapters(el){
  const sorted=[...DB.chapters].sort((a,b)=>a.no-b.no);
  if(!activeCh||!DB.chapters.find(c=>c.id===activeCh)) activeCh=sorted[0]?.id;
  const cur=DB.chapters.find(c=>c.id===activeCh);
  el.innerHTML=`<div class="sec-head"><div><h2>كتابة الفصول</h2><div class="sub">محرر الرواية — يُحفظ تلقائيًا مع كل نقرة حفظ</div></div>
    <div style="display:flex;gap:8px"><button class="btn ghost" onclick="addChapter()">＋ فصل جديد</button></div></div>
  <div class="editor-wrap">
    <div class="ch-list">${sorted.map(c=>`<div class="ch-item ${c.id===activeCh?'active':''}" onclick="setCh('${c.id}')">
      <span>الفصل ${c.no} — ${esc(c.title)}</span>
      <span class="n">${(c.text||'').trim().split(/\s+/).filter(Boolean).length} كلمة</span></div>`).join('')}</div>
    <div class="ch-editor">${cur?`
      <label>رقم الفصل</label><input id="ch_no" type="number" value="${cur.no}" style="width:110px">
      <label>عنوان الفصل</label><input id="ch_title" value="${esc(cur.title)}">
      <label>ملخص الفصل (يظهر في التصدير)</label><textarea id="ch_summary" rows="2">${esc(cur.summary)}</textarea>
      <label>نص الفصل</label><textarea id="ch_text" placeholder="اكتب هنا...">${esc(cur.text)}</textarea>
      <div class="wc"><span id="wc_n">0 كلمة</span><span id="wc_c">0 حرف</span></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn" onclick="saveChapter('${cur.id}')">💾 حفظ الفصل</button>
        <button class="btn danger" onclick="delChapter('${cur.id}')">حذف الفصل</button>
      </div>`:'<p style="color:var(--muted)">لا توجد فصول — أضف فصلًا جديدًا.</p>'}
    </div>
  </div>`;
  const ta=document.getElementById('ch_text');
  if(ta){ const upd=()=>{ const w=ta.value.trim().split(/\s+/).filter(Boolean).length; document.getElementById('wc_n').textContent=w.toLocaleString('ar')+' كلمة'; document.getElementById('wc_c').textContent=ta.value.length.toLocaleString('ar')+' حرف'; }; ta.addEventListener('input',upd); upd(); }
}
function setCh(id){ activeCh=id; render('chapters'); }
function addChapter(){ const n=Math.max(0,...DB.chapters.map(c=>c.no))+1; const c={id:uid('ch'),no:n,title:'فصل بلا عنوان',summary:'',text:''}; DB.chapters.push(c); activeCh=c.id; save(); render('chapters'); }
function saveChapter(id){ const c=DB.chapters.find(x=>x.id===id); c.no=parseInt(document.getElementById('ch_no').value)||c.no; c.title=document.getElementById('ch_title').value; c.summary=document.getElementById('ch_summary').value; c.text=document.getElementById('ch_text').value; save(); render('chapters'); }
function delChapter(id){ if(!confirm('حذف الفصل نهائيًا؟')) return; DB.chapters=DB.chapters.filter(c=>c.id!==id); activeCh=null; save(); render('chapters'); }

function fillAI(){
  const v=document.getElementById('ai_pick').value; if(!v) return;
  const [k,id]=v.split(':');
  let item=null, type='character';
  if(k==='c'){ item=DB.chars.find(x=>x.id===id); type='character'; }
  if(k==='r'){ item=DB.races.find(x=>x.id===id); type='creature'; }
  if(k==='p'){ item=DB.places.find(x=>x.id===id); type='place'; }
  if(item){ document.getElementById('ai_type').value=type;
    document.getElementById('ai_desc').value=(item.name||'')+' — '+(item.desc||'').slice(0,400); }
}
async function genPrompt(){
  const typeMap={character:'fantasy character portrait, full body',creature:'mythical creature design',place:'fantasy landscape environment',battle:'epic battle scene, wide shot',map:'fantasy world map, top-down view, parchment style, hand-drawn labels',cover:'epic fantasy book cover art, dramatic composition, space for title text'};
  const t=document.getElementById('ai_type').value;
  const d=document.getElementById('ai_desc').value.trim();
  const s=document.getElementById('ai_style').value;
  const m=document.getElementById('ai_mood').value;
  if(!d){ toast('اكتب وصفًا أولًا'); return; }
  const prompt=`${typeMap[t]}, ${d}, ${s}, ${m}, masterpiece, ultra detailed, sharp focus, from the epic Arabic fantasy novel "On the Shores of Fate"`;
  document.getElementById('prompt_out').textContent=prompt;
  toast('تم توليد الوصف ✓');
}
function copyPrompt(){
  const t=document.getElementById('prompt_out').textContent;
  navigator.clipboard.writeText(t).then(()=>toast('تم النسخ ✓')).catch(()=>{ 
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('تم النسخ ✓'); });
}

  <div class="grid">
    <div class="card"><h3>📖 تصدير الرواية</h3><p>ملف نصي بصيغة Markdown يضم الفصول مرتبة بأرقامها مع ملخصاتها — جاهز للطباعة أو التحويل إلى PDF/Word.</p>

      <button class="btn" style="margin-top:12px" onclick="exportJSON()">⬇️ تنزيل النسخة (.json)</button></div>
    <div class="card"><h3>📥 استيراد نسخة احتياطية</h3><p>استعد عالمك من ملف JSON سابق — سيستبدل البيانات الحالية بالكامل.</p>
      <input type="file" id="imp_file" accept=".json" style="margin-top:12px" onchange="importJSON(event)"></div>
    <div class="card"><h3>🖨️ طباعة / PDF</h3><p>افتح نافذة الطباعة للفصل الحالي أو الدليل — اختر "حفظ كـ PDF" من الطابعة.</p>
      <button class="btn ghost" style="margin-top:12px" onclick="window.print()">🖨️ طباعة الصفحة</button></div>
    <div class="card"><h3>♻️ استعادة البيانات الأصلية</h3><p>إعادة تحميل دليل العالم الافتراضي كما وصلك أول مرة (تُفقد تعديلاتك — صدّر نسخة أولًا!).</p>
      <button class="btn danger" style="margin-top:12px" onclick="resetDB()">♻️ استعادة الافتراضي</button></div>
  </div>`;
}
function download(name,content,type){
  const blob=new Blob(['\ufeff'+content],{type:type||'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
  toast('بدأ التنزيل ✓');
}
function exportNovel(){
  const sorted=[...DB.chapters].sort((a,b)=>a.no-b.no);
  let md=`# على ضفاف المصير\n## «تتكسَّر أحلام الفرسان»\n\n---\n\n`;
  sorted.forEach(c=>{ md+=`\n# الفصل ${c.no}: ${c.title}\n\n`; if(c.summary) md+=`> ${c.summary}\n\n`; md+=(c.text||'_(لم يُكتب بعد)_')+'\n\n---\n'; });
  download('على_ضفاف_المصير_الرواية.md',md);
}
function exportWorld(){
  let md=`# دليل عالم «على ضفاف المصير»\n\n`;
  md+=`## العصور التاريخية\n\n`; DB.eras.forEach(e=>md+=`### ${e.name} (${e.range})\n${e.desc}\n\n`);
  md+=`## الخط الزمني\n\n`; [...DB.timeline].sort((a,b)=>a.num-b.num).forEach(t=>md+=`- **${t.year} — ${t.title}** (${t.era})\n  ${t.text}\n\n`);
  md+=`## الشعوب والأجناس\n\n`; DB.races.forEach(r=>md+=`### ${r.name} — ${r.tag}\n${r.desc}\n\n`);
  md+=`## العائلات والقوى\n\n`; DB.families.forEach(f=>md+=`### ${f.name} — ${f.tag}\n${f.desc}\n\n`);
  md+=`## الشخصيات\n\n`; DB.chars.forEach(c=>md+=`### ${c.name} — ${c.role}\nالجنس: ${c.race} | الحقبة: ${c.era} | الحالة: ${c.status}\n${c.desc}\n\n`);
  md+=`## الأماكن\n\n`; DB.places.forEach(p=>md+=`### ${p.name} (${p.cat})\n${p.desc}\n\n`);
  md+=`## الأسرار (للمؤلف فقط)\n\n`; DB.secrets.forEach(s=>md+=`### ${s.name} [${s.level}]\n${s.desc}\n\n`);
  download('دليل_عالم_على_ضفاف_المصير.md',md);
}
function exportJSON(){ download('نسخة_احتياطية_عالم_ضفاف_المصير.json', JSON.stringify(DB,null,2),'application/json;charset=utf-8'); }
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.timeline||!d.chapters) throw 0; DB=d; save(); render('dash'); toast('تم الاستيراد ✓'); }
    catch(e){ alert('ملف غير صالح'); } };
  r.readAsText(f);
}
